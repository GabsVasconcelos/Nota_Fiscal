server {
    listen 80;

    server_name localhost;

    # Root directory for static files
    root /usr/share/nginx/html;

    # Enable Basic Authentication
    location / {
        auth_basic "Protected Area";
        auth_basic_user_file /etc/nginx/.htpasswd;

        index front.html;
        try_files $uri $uri/ =404;
    }
}
